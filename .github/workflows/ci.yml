name: CI (테스트 & 빌드)

on:
  pull_request:
    branches: [ "develop" ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - '.github/workflows/**'
      - 'docker-compose*.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드
        run: ./gradlew clean build -x test
