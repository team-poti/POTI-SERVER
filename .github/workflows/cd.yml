name: CD (JIB 이미지 & 무중단 배포)

on:
  push:
    branches: [ "develop", "main" ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - '.github/workflows/**'
      - 'docker-compose*.yml'
      - 'infra/alloy/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Jib으로 이미지 빌드 및 푸시
        run: |
          chmod +x gradlew
          ./gradlew jib
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: 배포 파일 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "deploy.sh,docker-compose.yml"
          target: "/home/ubuntu/app"

      - name: .env 복원
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            echo "${{ secrets.ENV_FILE }}" | base64 -d > ~/app/.env.tmp
            test -s ~/app/.env.tmp || { echo ".env 복원 실패: 파일이 비어 있습니다"; exit 1; }
            mv ~/app/.env.tmp ~/app/.env
            chmod 600 ~/app/.env

      - name: Firebase 크리덴셜 복원
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 -d > ~/app/firebase-service-account.json
            chmod 600 ~/app/firebase-service-account.json
            test -s ~/app/firebase-service-account.json || { echo "Firebase 크리덴셜 파일이 비어 있습니다"; exit 1; }
            python3 -c "import json,sys; json.load(open('$HOME/app/firebase-service-account.json'))" || { echo "Firebase 크리덴셜 JSON 형식이 잘못됐습니다"; exit 1; }

      - name: 배포 파일 검증
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            if [ ! -f ~/app/deploy.sh ] || [ ! -f ~/app/docker-compose.yml ]; then
              echo "배포 파일 전송 실패"
              exit 1
            fi

      - name: 배포 스크립트 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/app
            chmod +x deploy.sh
            ./deploy.sh

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: 배포 파일 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "deploy.sh,docker-compose.yml,docker-compose.prod.yml"
          target: "/home/ubuntu/app"

      - name: Alloy 설정 파일 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "infra/alloy/config.alloy"
          target: "/home/ubuntu/app"
          strip_components: 0

      - name: .env 복원
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            echo "${{ secrets.ENV_FILE }}" | base64 -d > ~/app/.env.tmp
            test -s ~/app/.env.tmp || { echo ".env 복원 실패: 파일이 비어 있습니다"; exit 1; }
            mv ~/app/.env.tmp ~/app/.env
            chmod 600 ~/app/.env

      - name: Firebase 크리덴셜 복원
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 -d > ~/app/firebase-service-account.json
            chmod 600 ~/app/firebase-service-account.json
            test -s ~/app/firebase-service-account.json || { echo "Firebase 크리덴셜 파일이 비어 있습니다"; exit 1; }
            python3 -c "import json,sys; json.load(open('$HOME/app/firebase-service-account.json'))" || { echo "Firebase 크리덴셜 JSON 형식이 잘못됐습니다"; exit 1; }

      - name: 배포 파일 검증
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            if [ ! -f ~/app/deploy.sh ] || [ ! -f ~/app/docker-compose.yml ]; then
              echo "배포 파일 전송 실패"
              exit 1
            fi

      - name: 배포 스크립트 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/app
            chmod +x deploy.sh
            ./deploy.sh
