name: CD (JIB 이미지 & 무중단 배포)

on:
  push:
    branches: [ "develop", "feat/#5/cicd" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Jib으로 이미지 빌드 및 푸시
        run: |
          chmod +x gradlew
          ./gradlew jib
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: 배포 파일 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "deploy.sh, docker-compose.yml"
          target: "/home/ubuntu/app"

      - name: 배포 파일 검증
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            if [ ! -f ~/app/deploy.sh ] || [ ! -f ~/app/docker-compose.yml ]; then
              echo "배포 파일 전송 실패"
              exit 1
            fi

      - name: 배포 스크립트 실행 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/app
            chmod +x deploy.sh
            ./deploy.sh
