version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis
    command: >
      redis-server 
      --maxmemory 100mb 
      --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - ./redis_data:/data  # 껐다 켜도 데이터 유지
    networks:
      - poti-net            # 네트워크
    restart: always

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"
    env_file:
      - .env
    environment:
      DOZZLE_USERNAME: ${DOZZLE_USER}
      DOZZLE_PASSWORD: ${DOZZLE_PW}

    # 네트워크 정의
networks:
  poti-net:
    name: poti-net
    driver: bridge