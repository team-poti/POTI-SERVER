version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: poti
      MYSQL_ROOT_HOST: '%'
      TZ: Asia/Seoul
    expose:
      - "3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - poti-net
    restart: always

  redis:
    image: redis:alpine
    container_name: redis
    command: >
      redis-server
      --maxmemory 100mb
      --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - ./redis_data:/data
    networks:
      - poti-net
    restart: always

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"
    env_file:
      - .env
    environment:
      DOZZLE_USERNAME: ${DOZZLE_USER}
      DOZZLE_PASSWORD: ${DOZZLE_PW}

networks:
  poti-net:
    name: poti-net
    driver: bridge
