version: '3.8'

services:
  poti-blue:
    image: dlacofbs/poti-server:latest
    container_name: poti-blue
    ports:
      - "8080:8080"  # 외부(EC2) 8080 ➡ 내부(Container) 8080
    environment:
      - JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=dev
    env_file:
      - .env  # DB 비밀번호 등은 여기서 가져옴
    networks:
      - poti-net
    restart: always

  poti-green:
    image: dlacofbs/poti-server:latest
    container_name: poti-green
    ports:
      - "8081:8080"  # 외부(EC2) 8081 ➡ 내부(Container) 8080
    environment:
      - JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=dev
    env_file:
      - .env
    networks:
      - poti-net
    restart: always
    
networks:
  poti-net:
    external: true