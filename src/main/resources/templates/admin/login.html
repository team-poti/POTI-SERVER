<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POTI Admin - 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #212529; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 360px; border-radius: 12px; }
  </style>
</head>
<body>
<div class="card login-card shadow-lg">
  <div class="card-body p-4">
    <h4 class="text-center mb-4 fw-bold">🍵 POTI Admin</h4>
    <div th:if="${param.error}" class="alert alert-danger py-2 small">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    <div th:if="${param.logout}" class="alert alert-success py-2 small">로그아웃 되었습니다.</div>
    <form th:action="@{/admin/login}" method="post">
      <div class="mb-3">
        <label class="form-label small fw-semibold">아이디</label>
        <input type="text" name="username" class="form-control" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">비밀번호</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-dark w-100">로그인</button>
    </form>
  </div>
</div>
</body>
</html>
