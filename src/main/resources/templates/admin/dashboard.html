<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::section}, 'dashboard')}">
<body>
<section>
  <div class="row g-3 mb-3">
    <div class="col-md-3">
      <div class="stat-card">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="stat-label">총 유저 수</span>
            <div class="stat-icon" style="background:#ede9fe;">
              <i class="bi bi-people-fill" style="color:#7c3aed;"></i>
            </div>
          </div>
          <div class="stat-value" th:text="${userCount}">0</div>
          <div class="stat-desc">가입된 전체 유저</div>
        </div>
        <div class="stat-bar" style="background:linear-gradient(90deg,#7c3aed,#a78bfa);"></div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="stat-label">분철글 수</span>
            <div class="stat-icon" style="background:#dbeafe;">
              <i class="bi bi-card-list" style="color:#1d4ed8;"></i>
            </div>
          </div>
          <div class="stat-value" th:text="${postCount}">0</div>
          <div class="stat-desc">등록된 전체 분철글</div>
        </div>
        <div class="stat-bar" style="background:linear-gradient(90deg,#1d4ed8,#60a5fa);"></div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="stat-label">총 주문 수</span>
            <div class="stat-icon" style="background:#dcfce7;">
              <i class="bi bi-bag-check-fill" style="color:#15803d;"></i>
            </div>
          </div>
          <div class="stat-value" th:text="${orderCount}">0</div>
          <div class="stat-desc">전체 주문 건수</div>
        </div>
        <div class="stat-bar" style="background:linear-gradient(90deg,#15803d,#4ade80);"></div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="stat-label">아티스트 수</span>
            <div class="stat-icon" style="background:#fff7ed;">
              <i class="bi bi-stars" style="color:#ea580c;"></i>
            </div>
          </div>
          <div class="stat-value" th:text="${artistCount}">0</div>
          <div class="stat-desc">등록된 아티스트</div>
        </div>
        <div class="stat-bar" style="background:linear-gradient(90deg,#ea580c,#fb923c);"></div>
      </div>
    </div>
  </div>

  <div class="quick-card">
    <div class="section-title">빠른 이동</div>
    <div class="d-flex gap-2 flex-wrap">
      <a th:href="@{/admin/users}" class="quick-link">
        <i class="bi bi-people-fill" style="color:#7c3aed;"></i> 유저 관리
      </a>
      <a th:href="@{/admin/posts}" class="quick-link">
        <i class="bi bi-card-list" style="color:#1d4ed8;"></i> 분철글 관리
      </a>
      <a th:href="@{/admin/artists}" class="quick-link">
        <i class="bi bi-stars" style="color:#ea580c;"></i> 아티스트 관리
      </a>
    </div>
  </div>
</section>
</body>
</html>
