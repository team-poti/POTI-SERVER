<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::section}, 'users')}">
<body>
<section>
  <h4 class="mb-4 fw-bold">유저 관리</h4>
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
        <tr>
          <th class="ps-3">ID</th>
          <th>닉네임</th>
          <th>이메일</th>
          <th>소셜</th>
          <th>상태</th>
          <th>가입일</th>
          <th class="pe-3">관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users.content}">
          <td class="ps-3 text-muted small" th:text="${user.id}"></td>
          <td th:text="${user.nickname}"></td>
          <td class="small text-muted" th:text="${user.email}"></td>
          <td>
            <span class="badge bg-warning text-dark" th:text="${user.socialType}"></span>
          </td>
          <td>
            <span th:if="${user.status.name() == 'ACTIVE'}" class="badge bg-success" th:text="${user.status.description}"></span>
            <span th:if="${user.status.name() == 'SUSPENDED'}" class="badge bg-danger" th:text="${user.status.description}"></span>
            <span th:if="${user.status.name() == 'WITHDRAWN'}" class="badge bg-secondary" th:text="${user.status.description}"></span>
          </td>
          <td class="small text-muted" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}"></td>
          <td class="pe-3">
            <div class="d-flex gap-1">
              <form th:if="${user.status.name() == 'ACTIVE'}"
                    th:action="@{/admin/users/{id}/suspend(id=${user.id})}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-danger"
                        onclick="return confirm('이용 정지하시겠습니까?')">정지</button>
              </form>
              <form th:if="${user.status.name() == 'SUSPENDED'}"
                    th:action="@{/admin/users/{id}/unsuspend(id=${user.id})}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-success">해제</button>
              </form>
              <form th:if="${user.status.name() != 'WITHDRAWN'}"
                    th:action="@{/admin/users/{id}/withdraw(id=${user.id})}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-secondary"
                        onclick="return confirm('강제 탈퇴 처리하시겠습니까?')">탈퇴</button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${users.content.empty}">
          <td colspan="7" class="text-center text-muted py-4">유저가 없습니다.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pagination -->
  <nav th:if="${users.totalPages > 1}" class="mt-3">
    <ul class="pagination pagination-sm justify-content-center">
      <li class="page-item" th:classappend="${users.first} ? 'disabled'">
        <a class="page-link" th:href="@{/admin/users(page=${users.number - 1})}">이전</a>
      </li>
      <li class="page-item" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
          th:classappend="${i == users.number} ? 'active'">
        <a class="page-link" th:href="@{/admin/users(page=${i})}" th:text="${i + 1}"></a>
      </li>
      <li class="page-item" th:classappend="${users.last} ? 'disabled'">
        <a class="page-link" th:href="@{/admin/users(page=${users.number + 1})}">다음</a>
      </li>
    </ul>
  </nav>
</section>
</body>
</html>
