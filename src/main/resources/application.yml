server:
  port: 8080
  servlet:
    encoding:
      force: true
      charset: UTF-8
      enabled: true

spring:
  application:
    name: poti-server

  # 1. Database (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ???(Asia/Seoul)? ???(utf8mb4) ?? ??
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/poti_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  # 2. JPA
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update} # ??? update, ?? ? validate? ?? ??
    properties:
      hibernate:
        format_sql: true
        show_sql: false # P6Spy? ??? false? ?? (?? ?? ??)
        default_batch_fetch_size: 100 # N+1 ?? ??
        dialect: org.hibernate.dialect.MySQL8Dialect

  # 3. Redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD} # ??? ?? ??

  # 4. OAuth2 (Kakao)
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI} # http://localhost:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # 5. File Upload (Multipart)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 6. AWS S3 (Spring Cloud AWS)
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${S3_BUCKET_NAME}

# 7. Actuator (Health Check)
management:
  endpoints:
    web:
      exposure:
        include: health

# 8. Custom JWT Config
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 3600000 # 1?? (ms)
  refresh-token-validity: 1209600000 # 14? (ms)

# 9. Logging
logging:
  level:
    root: INFO
    org.sopt: DEBUG