<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포티 POTI</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="download-page">
    <img
      src="./assets/background.svg"
      class="background-graphic"
      aria-hidden="true"
    />

    <img
      src="./assets/logo.svg"
      alt="POTI"
      class="logo"
    />

    <section class="content">
      <div class="copy">
        <h1>굿즈 분철을 더 간편하게</h1>

        <p>
          갖고 싶은 건 쉽게, 나누고 싶은 건 편하게!<br>
          덕질에 필요한 분철, 이제 포티에서 시작해보세요.
        </p>
      </div>

      <div class="card-area" aria-hidden="true">
        <img
          src="./assets/card-graphic.svg"
          alt=""
          class="cards-graphic"
        />
      </div>

      <div class="download-buttons">
        <a
          href="#"
          class="download-button"
          target="_blank"
          rel="noopener noreferrer"
        >
          App Store 다운로드
        </a>

        <a
          href="#"
          class="download-button"
          target="_blank"
          rel="noopener noreferrer"
        >
          Google Play 다운로드
        </a>
      </div>
    </section>
  </main>
</body>
</html>
